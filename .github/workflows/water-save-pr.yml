name: TILLFOLK — save de ordens da lagoa
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game.js'
      - 'tests/water-order-resume.spec.cjs'
      - '.github/workflows/water-save-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar sintaxe, logística e terreno
        run: |
          node --check src/game.js
          node --check tests/water-order-resume.spec.cjs
          node --test tests/logistics.test.cjs tests/worker-restrictions.test.cjs
          node --test tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
      - name: Preparar Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Servir site HTML5
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-water.log 2>&1 &
          sleep 2
      - name: Testar recuperação da coleta de água
        run: npx playwright test tests/water-order-resume.spec.cjs --browser chromium --workers=1 --reporter=line
