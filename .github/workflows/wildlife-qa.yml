name: TILLFOLK — QA de fauna e terrenos
on:
  pull_request:
    paths:
      - 'src/exploration.js'
      - 'src/game.js'
      - 'tests/wildlife-animations.test.cjs'
      - 'index.html'
      - '.github/workflows/wildlife-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/exploration.js'
      - 'src/game.js'
      - 'tests/wildlife-animations.test.cjs'
      - 'index.html'
      - '.github/workflows/wildlife-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check src/exploration.js
          node --check src/game.js
      - name: Verificar fauna, sprites e atlas imutável
        run: node --test tests/wildlife-animations.test.cjs tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
