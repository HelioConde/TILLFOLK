name: TILLFOLK — smoke mapa e biomas
on:
  push:
    branches: [main]
    paths:
      - 'src/biomes.js'
      - 'src/wild-world.js'
      - 'src/game.js'
      - 'src/task-orders.js'
      - 'tests/biomes.spec.cjs'
      - 'index.html'
      - 'camera-ui.css'
      - '.github/workflows/biome-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  biomes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check src/biomes.js
          node --check src/wild-world.js
          node --check src/game.js
          node --check src/task-orders.js
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar site estático
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-smoke.log 2>&1 &
          sleep 2
      - name: Testar mundo e capturar telas
        run: npx playwright test tests/biomes.spec.cjs --browser chromium --reporter=line --workers=1
      - name: Anexar imagens e relatório
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tillfolk-biomas-qa
          path: |
            screenshots/biomas-*.png
            test-results/
          if-no-files-found: warn
          retention-days: 14
