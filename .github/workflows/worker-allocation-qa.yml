name: TILLFOLK — QA de alocação dos colonos
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/worker-allocation.js'
      - 'src/game.js'
      - 'index.html'
      - 'tests/worker-allocation.test.cjs'
      - 'tests/worker-allocation.spec.cjs'
      - '.github/workflows/worker-allocation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/worker-allocation.js'
      - 'src/game.js'
      - 'index.html'
      - 'tests/worker-allocation.test.cjs'
      - 'tests/worker-allocation.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Restrições, escassez e contrato de terrenos
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/worker-allocation.js
          node --check src/game.js
          node --test tests/worker-allocation.test.cjs
          node --test tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
  browser:
    name: Trabalhadores em partida real
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-ai-http.log 2>&1 &
          sleep 2
      - run: npx playwright test tests/worker-allocation.spec.cjs --workers=1 --browser chromium --reporter=line
      - name: Evidências do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-alocacao-colonos
          path: |
            screenshots/alocacao-*.png
            test-results/
          retention-days: 14
          if-no-files-found: warn
