name: TILLFOLK — limite de ordens e mapa legível
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game.js'
      - 'tests/area-order-guard.spec.cjs'
      - '.github/workflows/area-order-guard-pr.yml'
permissions:
  contents: read
jobs:
  area-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar sintaxe, logística e terreno imutável
        run: |
          node --check src/game.js
          node --check tests/area-order-guard.spec.cjs
          node --test tests/worker-allocation.test.cjs tests/logistics.test.cjs
          node --test tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
      - name: Preparar Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Servir jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-area-map.log 2>&1 &
          sleep 2
      - name: Validar arrasto seguro e agrupamento visual
        run: npx playwright test tests/area-order-guard.spec.cjs --browser chromium --workers=1 --reporter=line
      - name: Guardar capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-area-orders-capturas
          path: |
            screenshots/area-tutorial-limite-24-1600x900.png
            screenshots/ordens-agrupadas-50-percent-1600x900.png
            test-results/
          if-no-files-found: warn
          retention-days: 14
