name: TILLFOLK — QA da jornada após o tutorial
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/first-village-guide.js'
      - 'src/game.js'
      - 'index.html'
      - 'tutorial-missions.css'
      - 'tests/first-village-guide.test.cjs'
      - 'tests/first-village-guide.spec.cjs'
      - '.github/workflows/qa-first-village.yml'
  push:
    branches: [main]
    paths:
      - 'src/first-village-guide.js'
      - 'src/game.js'
      - 'index.html'
      - 'tutorial-missions.css'
      - 'tests/first-village-guide.test.cjs'
      - 'tests/first-village-guide.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Objetivos reais e contrato imutável de terrenos
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/first-village-guide.js
          node --check src/game.js
          node --test tests/first-village-guide.test.cjs tests/tutorial-missions.test.cjs
          node --test tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
  browser:
    name: Encerrar tutorial e abrir jornada no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-primeira-vila.log 2>&1 &
          sleep 2
      - run: npx playwright test tests/first-village-guide.spec.cjs --workers=1 --browser chromium --reporter=line
      - name: Capturas e falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-primeira-vila
          path: |
            screenshots/tutorial-proxima-vila-*.png
            test-results/
          if-no-files-found: warn
          retention-days: 14
