name: TILLFOLK — QA de backup JSON
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/save-backup.js'
      - 'save-backup.css'
      - 'index.html'
      - 'tests/save-backup.test.cjs'
      - 'tests/save-backup.spec.cjs'
      - '.github/workflows/backup-json-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/save-backup.js'
      - 'save-backup.css'
      - 'index.html'
      - 'tests/save-backup.test.cjs'
      - 'tests/save-backup.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Integridade do backup e contrato dos terrenos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/save-backup.js
          node --test tests/save-backup.test.cjs
          node --test tests/terrain-contract.test.cjs tests/terrain-biomes.test.cjs tests/terrain-autotile.test.cjs
  browser:
    name: Exportar e importar no Chromium (desktop/mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-backup-http.log 2>&1 &
          sleep 2
      - run: npx playwright test tests/save-backup.spec.cjs --browser chromium --workers=1 --reporter=line
      - name: Guardar capturas e erros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-backup-json-qa
          path: |
            screenshots/backup-*.png
            test-results/
          if-no-files-found: warn
          retention-days: 14
