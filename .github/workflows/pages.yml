name: TILLFOLK — validar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tillfolk-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar cena HTML5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check src/biomes.js
          node --check src/terrain-autotile.js
          node --check src/terrain-catalog.js
          node --test tests/terrain-biomes.test.cjs
          node --test tests/terrain-autotile.test.cjs
          # Regra obrigatória: impede alterar posições, cantos e grade dos 9 terrenos.
          node --test tests/terrain-contract.test.cjs
          # Água deve separar ilhas, sem cobrir as bordas do autotile fixo.
          node --test tests/coast-water.test.cjs
          node --test tests/terrain-editor.test.cjs
          node --check src/wild-world.js
          node --test tests/biome-rivers.test.cjs tests/bridge-geometry.test.cjs tests/continent-protection.test.cjs tests/wildlife-animations.test.cjs
          node --check src/game.js
          node --check src/day-night.js
          node --check src/progression.js
          node --check src/colony-contracts.js
          node --test tests/colony-contracts.test.cjs
          node --test tests/progression.test.cjs
          node --check src/space-program.js
          node --test tests/space-program.test.cjs
          node --check src/mineral-progression.js
          node --test tests/mineral-progression.test.cjs
          node --test tests/crafting.test.cjs
          node --check src/colony-life.js
          node --check src/colony-council.js
          node --test tests/colony-council.test.cjs
          node --test tests/day-night.test.cjs tests/colony-life.test.cjs
          node --test tests/specialization.test.cjs
          node --check src/survival.js
          node --check src/tutorial-pointer.js
          node --check src/live-update.js
          node --test tests/hunger.test.cjs tests/survival-death.test.cjs tests/survival-hud.test.cjs
          node --check src/crop-catalog.js
          node --check src/crafting.js
          node --test tests/crafting.test.cjs
          node --test tests/crops.test.cjs tests/crop-strategy.test.cjs
          node --check src/missions.js
          node --test tests/tutorial-missions.test.cjs
          node --check src/game-hud.js
          node --check src/sprout-ui-skin.js
          node --check src/task-orders.js
          node --check src/house-building.js
          node --check src/blueprints.js
          node --check src/menu.js
          node --check src/tutorial.js
          node --check src/house-renderer.js
          node --test tests/house-renderer.test.cjs
          node --check src/menu-scene.js
      - name: Montar site estático mínimo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/public/assets
          # Publicar todos os estilos locais. Evita 404 quando novos sistemas forem adicionados.
          cp index.html ./*.css _site/
          # Publicar todos os módulos do motor, incluindo sobrevivência e guia do tutorial.
          cp src/*.js _site/src/
          cp -a public/assets/sprout-lands _site/public/assets/
          cp -a public/assets/tillfolk _site/public/assets/
          # Texturas de todos os terrenos Sprout Lands usados pelo jogo.
          TERRAIN_ROOT="Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Tilesets/ground tiles/New tiles"
          mkdir -p "_site/public/assets/$TERRAIN_ROOT"
          cp "public/assets/$TERRAIN_ROOT/"*.png "_site/public/assets/$TERRAIN_ROOT/"
          cp "public/assets/$TERRAIN_ROOT/Grass_Tile_Layers_terrain.json" "_site/public/assets/$TERRAIN_ROOT/"
          test -f "_site/public/assets/$TERRAIN_ROOT/Grass_Tile_Layers_terrain.json"
          test -f "_site/public/assets/$TERRAIN_ROOT/Grass_Tile_Layers.png"
          test -f "_site/public/assets/$TERRAIN_ROOT/Soil_Ground_Tiles.png"
          test -f "_site/public/assets/$TERRAIN_ROOT/Stone_Ground_Tiles.png"
          mkdir -p _site/public/assets/assets
          cp -a public/assets/assets/crops _site/public/assets/assets/
          mkdir -p "_site/public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects"
          cp "public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/work station.png" "_site/public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/"
          mkdir -p "_site/public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/Items"
          cp "public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/Items/tools and meterials.png" "_site/public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/Items/"
          CHEST_ROOT="Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Tilesets/Building parts"
          mkdir -p "_site/public/assets/$CHEST_ROOT"
          cp "public/assets/$CHEST_ROOT/Chest.png" "_site/public/assets/$CHEST_ROOT/"
          cp "public/assets/$CHEST_ROOT/Wooden_Bridge_v2.png" "_site/public/assets/$CHEST_ROOT/"
          # Publicar todas as direções e quadros declarados no catálogo, sem
          # copiar pastas gigantes nem deixar algum frame faltando no Pages.
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('src/exploration.js','utf8'),context);
          const sprites=context.window.TillfolkExploration.spriteSources();
          const species=Object.entries(context.window.TillfolkExploration.ANIMATIONS);
          const expected=species.reduce((total,[,profile])=>total+Object.keys(profile.clips).length,0);
          const unique=new Set(sprites.map(sprite=>sprite.key));
          if(species.length<6||sprites.length!==expected||unique.size!==expected)
            throw new Error('Catálogo de animais inconsistente: '+species.length+
              ' espécies / '+sprites.length+' sprites / '+expected+' animações esperadas');
          for(const sprite of sprites){
            const relative=decodeURIComponent(sprite.url.replace(/^\.\//,''));
            if(!relative.startsWith('public/assets/')||relative.includes('..'))
              throw new Error('Sprite inseguro: '+relative);
            if(!fs.existsSync(relative))throw new Error('Animação ausente: '+relative);
            const destination=path.join('_site',relative);
            fs.mkdirSync(path.dirname(destination),{recursive:true});
            fs.copyFileSync(relative,destination);
            if(fs.statSync(destination).size<100)throw new Error('PNG inválido: '+relative);
          }
          console.log(sprites.length+' spritesheets de animais publicados');
          NODE
          test -f "_site/public/assets/$CHEST_ROOT/Chest.png"
          test -f "_site/public/assets/$CHEST_ROOT/Wooden_Bridge_v2.png"
          node --check src/logistics.js
          node --test tests/logistics.test.cjs
          cp -a "public/assets/Sprout Lands - UI Pack - Basic pack" _site/public/assets/
          cp "public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Tilesets/ground tiles/New tiles/Grass_Tile_Layers_MAPEAR.html" _site/mapear_grama.html
          cp terrain-editor.html _site/terrain-editor.html
          # A assinatura da versão é o commit publicado, não a data do navegador.
          # URLs CSS/JS recebem o SHA: não se misturam scripts antigos e novos no cache.
          node <<'NODE'
          const fs=require('node:fs');
          const version=process.env.GITHUB_SHA;
          if(!/^[0-9a-f]{40}$/.test(version))throw new Error('SHA de release inválido');
          fs.writeFileSync('_site/version.json',JSON.stringify({version})+'\n');
          let html=fs.readFileSync('_site/index.html','utf8');
          const buildTag='<meta name="tillfolk-build" content="dev">';
          if(!html.includes(buildTag))throw new Error('Tag da versão não encontrada');
          html=html.replace(buildTag,'<meta name="tillfolk-build" content="'+version+'">');
          html=html.replace(/((?:href|src)="\.\/[^"]+\.(?:css|js))(?:\?[^"]*)?"/g,
            (_,prefix)=>prefix+'?v='+version+'"');
          fs.writeFileSync('_site/index.html',html);
          if(!html.includes('./src/live-update.js?v='+version))
            throw new Error('Atualizador ausente do HTML versionado');
          console.log('GitHub Pages preparado para release '+version);
          NODE
          # Conferir TODAS as dependências .css e .js referenciadas no HTML publicado.
          # O teste roda no artefato real, não apenas na árvore fonte do repositório.
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('_site/index.html', 'utf8');
          let checked = 0;
          for (const tag of html.match(/<(?:link|script)\b[^>]*>/gi) || []) {
            const match = tag.match(/\b(?:href|src)\s*=\s*["']([^"']+)["']/i);
            if (!match || !match[1].startsWith('./')) continue;
            const relative = decodeURIComponent(match[1].split(/[?#]/)[0].slice(2));
            if (!/\.(?:css|js)$/i.test(relative)) continue;
            checked++;
            if (!fs.existsSync('_site/' + relative))
              throw new Error('CSS/JS não publicado: ' + relative);
          }
          if (checked < 30) throw new Error('Referências HTML incompletas: ' + checked);
          const scripts = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)].map(m => m[1].split('?')[0]);
          const survival = scripts.indexOf('./src/survival.js');
          const game = scripts.indexOf('./src/game.js');
          if (survival < 0 || game < 0 || survival >= game)
            throw new Error('survival.js deve carregar antes de game.js');
          console.log('Recursos HTML validados no artefato: ' + checked + ' arquivos CSS/JS');
          NODE
          test -s _site/version.json
          test -f _site/src/live-update.js
          test -f _site/live-update.css
          test -f _site/public/assets/sprout-lands/characters/worker-basic.png
          test -f _site/public/assets/sprout-lands/characters/worker-variants.png
          test -f _site/public/assets/sprout-lands/characters/worker-actions.png
          test -f _site/public/assets/sprout-lands/characters/watering-effects.png
          test -f _site/public/assets/sprout-lands/terrain/grass.png
          test -f _site/public/assets/sprout-lands/farming/crops.png
          test -f _site/public/assets/tillfolk/menu-landscape.svg
          test -f _site/src/biomes.js
          test -f _site/src/day-night.js
          test -f _site/src/progression.js
          test -f _site/src/mineral-progression.js
          grep -q 'src/mineral-progression.js' _site/index.html
          grep -q 'mineral-progression-list' _site/index.html
          test -f _site/src/space-program.js
          test -f _site/space-program.css
          test -f _site/progression.css
          grep -q 'space-mission-status' _site/index.html
          grep -q 'rocket-victory-dialog' _site/index.html
          grep -q 'src/progression.js' _site/index.html
          grep -q 'progression-dialog' _site/index.html
          test -f _site/src/colony-life.js
          test -f _site/colony-life.css
          grep -q 'src/day-night.js' _site/index.html
          grep -q 'src/colony-life.js' _site/index.html
          test -f _site/src/terrain-autotile.js
          test -f _site/src/terrain-catalog.js
          grep -q 'src/terrain-catalog.js' _site/index.html
          test -f _site/terrain-editor.html
          grep -q 'terrain-autotile.js' _site/terrain-editor.html
          test -f _site/src/wild-world.js
          test -f _site/src/exploration.js
          grep -q 'src/exploration.js' _site/index.html
          test -f _site/src/menu.js
          test -f _site/src/missions.js
          test -f _site/src/crop-catalog.js
          test -f _site/src/crafting.js
          test -f _site/crop-workshop.css
          test -f _site/public/assets/assets/crops/carrot/growth_basic/carrot_16x16_7frames.png
          test -f "_site/public/assets/Sprout Lands - Sprites - premium pack/Sprout Lands - Sprites - premium pack/Objects/work station.png"
          test -f _site/tutorial-missions.css
          grep -q 'src/missions.js' _site/index.html
          grep -q 'tutorial-missions.css' _site/index.html
          test -f _site/src/tutorial.js
          test -f _site/menu-refinement.css
          test -f _site/hud-settings.css
          test -f _site/game-hud.css
          test -f _site/sprout-ui.css
          test -f _site/game-refinement.css
          test -f _site/game-interface.css
          test -f _site/camera-ui.css
          test -f _site/top-speed.css
          grep -q 'top-speed.css' _site/index.html
          grep -q 'game-refinement.css' _site/index.html
          test -f _site/src/sprout-ui-skin.js
          grep -q 'sprout-ui.css' _site/index.html
          test -f _site/src/game-hud.js
          grep -q 'game-hud.css' _site/index.html
          grep -q 'game-hud.js' _site/index.html
          test -f _site/team-ux.css
          test -f _site/src/house-renderer.js
          test -f _site/src/house-building.js
          test -f _site/src/blueprints.js
          grep -q 'src/blueprints.js' _site/index.html
          test -f _site/src/task-orders.js
          test -f _site/task-orders.css
          test -f _site/house-building.css
          test -f _site/src/menu-scene.js
          # Falhar a publicação caso alguma arte utilizada na abertura esteja ausente.
          node <<'NODE'
          const fs = require('node:fs');
          const code = fs.readFileSync('_site/src/menu-scene.js', 'utf8');
          const objects = code.match(/const sources=\{([\s\S]*?)\};/);
          if (!objects) throw new Error('Lista de sprites do menu não encontrada');
          const files = [...objects[1].matchAll(/[a-z]+:"([^"]+\.png)"/g)].map(match => match[1]);
          if (files.length < 14) throw new Error('Lista de sprites do menu incompleta');
          for (const file of files) {
            const path = '_site/public/assets/sprout-lands/' + file;
            if (!fs.existsSync(path) || fs.statSync(path).size < 100)
              throw new Error('Sprite ausente na publicação: ' + path);
          }
          const index = fs.readFileSync('_site/index.html', 'utf8');
          if (!index.includes('./src/menu-scene.js') || !index.includes('./src/house-renderer.js')) throw new Error('Cena ou montagem da casa ausente em index.html');
          console.log('Menu validado: ' + files.length + ' sprites presentes na publicação');
          NODE
          test -f _site/public/assets/sprout-lands/structures/wood-roof.png
          test -f _site/public/assets/sprout-lands/structures/wood-walls.png
          test -f _site/public/assets/sprout-lands/structures/wood-door.png
          test -f _site/public/assets/sprout-lands/terrain/dark-soil.png
          test -f _site/menu.css
          test -f _site/menu-layout.css
          grep -q 'src/task-orders.js' _site/index.html
          grep -q 'task-orders.css' _site/index.html
          # O CSS de layout do menu também precisa existir no site publicado.
          grep -q 'menu-layout.css' _site/index.html
          grep -q 'menu-layout.css' _site/menu-layout.css || test -s _site/menu-layout.css
          test -f "_site/public/assets/Sprout Lands - UI Pack - Basic pack/fonts/pixelFont-7-8x14-sproutLands.ttf"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
