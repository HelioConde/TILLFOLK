name: QA visual — menu e jogo TILLFOLK
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Sempre rodar no push da main, inclusive quando CSS, scripts ou assets mudarem.
  # O deploy do Pages depende explicitamente do sucesso deste workflow.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir versão real do jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-http.log 2>&1 &
          sleep 2
      - name: Capturar screenshots e validar cortes
        run: npx playwright test tests/menu.spec.cjs tests/house.spec.cjs tests/orders.spec.cjs tests/colony.spec.cjs tests/visual-refinement.spec.cjs tests/save-backup.spec.cjs tests/release-smoke.spec.cjs --browser chromium --reporter=line
      - name: Anexar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-screenshots-completas
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
