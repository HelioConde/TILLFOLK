name: QA visual — menu e jogo TILLFOLK
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game-options-polish.css'
      - 'tests/game-options.spec.cjs'
      - 'menu.css'
      - 'menu-layout.css'
      - 'menu-refinement.css'
      - 'src/tutorial.js'
      - 'src/missions.js'
      - 'tutorial-missions.css'
      - 'ui-polish.css'
      - 'src/menu.js'
      - 'src/menu-scene.js'
      - 'src/house-renderer.js'
      - 'src/game.js'
      - 'src/house-building.js'
      - 'tests/orders.spec.cjs'
      - 'tests/colony.spec.cjs'
      - 'tests/visual-refinement.spec.cjs'
      - 'tests/biomes.spec.cjs'
      - 'task-orders.css'
      - 'src/task-orders.js'
      - 'src/worker-task-scoring.js'
      - 'tests/worker-task-scoring.test.cjs'
      - 'tests/worker-task-ranking.spec.cjs'
      - 'tests/wildlife-manure.test.cjs'
      - 'src/irrigation-orders.js'
      - 'tests/irrigation-orders.test.cjs'
      - 'tests/irrigation-orders.spec.cjs'
      - 'house-building.css'
      - 'tests/house.spec.cjs'
      - 'src/biomes.js'
      - 'src/wild-world.js'
      - 'styles.css'
      - 'game-polish.css'
      - 'game-hud.css'
      - 'farming-strategy.css'
      - 'food-outlook.css'
      - 'src/food-ledger.js'
      - 'src/survival.js'
      - 'src/colony-council.js'
      - 'src/space-program.js'
      - 'tests/food-ledger.test.cjs'
      - 'tests/food-outlook.spec.cjs'
      - 'tests/crop-workshop.spec.cjs'
      - 'src/crop-catalog.js'
      - 'src/crop-care.js'
      - 'src/farm-planning.js'
      - 'tests/crop-care.test.cjs'
      - 'tests/crop-care.spec.cjs'
      - 'src/colony-life.js'
      - 'src/day-night.js'
      - 'tests/day-night.test.cjs'
      - 'tests/colony-life.test.cjs'
      - 'tests/day-routine.spec.cjs'
      - 'tests/crop-choice.spec.cjs'
      - 'tests/crop-strategy.test.cjs'
      - 'hud-clarity.css'
      - 'tests/hud-clarity.spec.cjs'
      - 'game-refinement.css'
      - 'camera-ui.css'
      - 'sprout-ui.css'
      - 'src/sprout-ui-skin.js'
      - 'src/game-hud.js'
      - 'fullscreen-game.css'
      - '.github/workflows/pages.yml'
      - 'tests/menu.spec.cjs'
      - 'tests/tutorial-flow.spec.cjs'
      - 'tests/tutorial-missions.test.cjs'
      - '.github/workflows/menu-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir versão real do jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tillfolk-http.log 2>&1 &
          sleep 2
      - name: Validar regras agrícolas
        run: |
          node --check src/crop-catalog.js
          node --check src/colony-life.js
          node --check src/day-night.js
          node --test tests/day-night.test.cjs tests/colony-life.test.cjs
          node --check src/game.js
          node --test tests/crop-strategy.test.cjs
          node --check src/crop-care.js
          node --check src/farm-planning.js
          node --test tests/crop-care.test.cjs
          node --check src/irrigation-orders.js
          node --check src/task-orders.js
          node --check src/worker-task-scoring.js
          node --test tests/worker-task-scoring.test.cjs tests/wildlife-manure.test.cjs
          node --test tests/irrigation-orders.test.cjs
          node --check src/food-ledger.js
          node --test tests/food-ledger.test.cjs
      - name: Capturar screenshots e validar cortes
        run: npx playwright test tests/menu.spec.cjs tests/game-options.spec.cjs tests/house.spec.cjs tests/orders.spec.cjs tests/colony.spec.cjs tests/visual-refinement.spec.cjs tests/biomes.spec.cjs tests/tutorial-flow.spec.cjs tests/hud-clarity.spec.cjs tests/crop-choice.spec.cjs tests/food-outlook.spec.cjs tests/crop-workshop.spec.cjs tests/crop-care.spec.cjs tests/irrigation-orders.spec.cjs tests/day-routine.spec.cjs tests/worker-task-ranking.spec.cjs --browser chromium --reporter=line --workers=2 --shard=${{ matrix.shard }}/3
      - name: Anexar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tillfolk-screenshots-shard-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
